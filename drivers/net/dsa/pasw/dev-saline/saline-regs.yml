  Ingress Transmission Gate Configuration:
    Address step: 8
    Attributes: []
    Default value: 0
    Description: Setup configurations for ingress transmission gates. Hardware is not aware of the configuration updates unless an update request is triggered by writing 1 to \register{Ingress Transmission Gate Update}. The transmission gate execution will start using the new configuration when the current time meets the \field{Ingress Transmission Gate Configuration}{adminBaseTime}.
