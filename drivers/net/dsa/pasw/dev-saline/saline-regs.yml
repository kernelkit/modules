  Egress Port Configuration:
    Address step: 1
    Attributes: []
    Default value: 0
    Description: This table configures various functions that are dependent on which port the packet leaves the switch.
    End address: 0x15b9
    Fields:
    - Default value: 0
      Description: If set, color remapping to outgoing packet headers is allowed. The default color remapping options are based on the egress port number from the \register{Color Remap From Egress Port} table. \ifdef{\texIngressAdmissionControl}{If a packet is subjected to ingress admission control, its ingress admission control pointer can provide remap options from the \register{Color Remap From Ingress Admission Control} table to override default options.}{}
      End bit: 0
      Name: colorRemap
      Start bit: 0
      Width: 1
    - Default value: 0
      Description: The egress port VLAN operation to perform on the packet. \tabFive{No operation.} {Swap.} {Push.} {Pop.} {Penultimate pop(remove all VLAN headers).}
      End bit: 3
      Name: vlanSingleOp
      Start bit: 1
      Width: 3
    - Default value: 0
      Description: Selects which VID to use when building a new VLAN header in a egress port push or swap operation. If the selected outermost VLAN header doesn't exist in the original packet then this table entry's \field{Egress Port Configuration}{vid} will be used. \tabFour{From outermost VLAN in the original incoming packet (if any).} {From this table entry's \field{Egress Port Configuration}{vid}.} {From the Ingress VID as selected in the \register{Source Port Table}.} {From the outermost VLANs VID after all previous VLAN operations, if packets previous vlan operations resulted in a outgoing packet has no VLAN then this tables entry's vid field will be used.}
      End bit: 5
      Name: vidSel
      Start bit: 4
      Width: 2
    - Default value: 0
      Description: Selects which CFI/DEI to use when building a new VLAN header in a egress port push or swap operation. If the selected outermost VLAN header doesn't exist in the original packet then this table entry's \field{Egress Port Configuration}{cfiDei} will be used. \tabFour{From outermost VLAN in the original incoming packet (if any).} {From this table entry's \field{Egress Port Configuration}{cfiDei}.} {From \register{Egress Queue To PCP And CFI/DEI Mapping Table}.} {From the outermost VLANs cfiDei after all previous VLAN operations, if packets previous vlan operations resulted in a outgoing packet has no VLAN then this tables entry's cfiDei field will be used.}
      End bit: 7
      Name: cfiDeiSel
      Start bit: 6
      Width: 2
    - Default value: 0
      Description: Selects which PCP to use when building a new VLAN header in a egress port push or swap operation. If the selected outermost VLAN header doesn't exist in the original packet then this table entry's \field{Egress Port Configuration}{pcp} will be used. \tabFour{From outermost VLAN in the original incoming packet (if any).} {From this table entry's \field{Egress Port Configuration}{pcp}.} {From \register{Egress Queue To PCP And CFI/DEI Mapping Table}.} {From the outermost VLANs PCP after all previous VLAN operations, if packets previous vlan operations resulted in a outgoing packet has no VLAN then this tables entry's pcp field will be used.}
      End bit: 9
      Name: pcpSel
      Start bit: 8
      Width: 2
    - Default value: 0
      Description: Selects which TPID to use when building a new VLAN header in a push or swap operation. \tabThree{C-VLAN - 0x8100.} {S-VLAN - 0x88A8.} {User defined VLAN type from register \register{Egress Ethernet Type for VLAN tag} field \field{Egress Ethernet Type for VLAN tag}{typeValue}.}
      End bit: 11
      Name: typeSel
      Start bit: 10
      Width: 2
    - Default value: 0
      Description: The VID used in egress port VLAN push or swap operation if selected by \field{Egress Port Configuration}{vidSel}.
      End bit: 0x17
      Name: vid
      Start bit: 12
      Width: 12
    - Default value: 0
      Description: The CFI/DEI used in egress port VLAN push or swap operation if selected by \field{Egress Port Configuration}{cfiDeiSel}.
      End bit: 0x18
      Name: cfiDei
      Start bit: 0x18
      Width: 1
    - Default value: 0
      Description: The PCP used in egress port VLAN push or swap operation if selected by \field{Egress Port Configuration}{pcpSel}.
      End bit: 0x1b
      Name: pcp
      Start bit: 0x19
      Width: 3
    - Default value: 0
      Description: Disabling this port. All packets to this port is dropped and \register{Egress Port Disabled Drop} is incremented. \tabTwo{All packets will be sent out.} {All packets will be dropped.}
      End bit: 0x1c
      Name: disabled
      Start bit: 0x1c
      Width: 1
    - Default value: 0
      Description: If set, remove the R-tag on this port for sequence recovery.
      End bit: 0x1d
      Name: delSeqNum
      Start bit: 0x1d
      Width: 1
