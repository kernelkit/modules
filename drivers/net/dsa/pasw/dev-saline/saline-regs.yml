conf bus 0:
  Buffer Free:
    Address step: 1
    Attributes:
    - consistency_check
    Default value: 0x400
    Description: The number of cells available in the buffer memory for incoming packets.
    End address: 3
    Fields:
    - Default value: 0x400
      Description: Number of free cells.
      End bit: 10
      Name: cells
      Start bit: 0
      Width: 11
    Number of entries: 1
    Short name: rg_buff_avail
    Start address: 3
    Type: r
    Width: 11
  Buffer Overflow Drop:
    Address step: 1
    Attributes:
    - drop_counter_check
    - block: pb_write
      name: bmOverflow
      type: error
    Default value: 0
    Description: Counter for the number of packets dropped due to the shared buffer memory being full.\bmOverflow
    End address: 0x1435
    Fields:
    - Default value: 0
      Description: Number of dropped packets.
      End bit: 0x17
      Name: packets
      Start bit: 0
      Width: 0x18
    Number of entries: 1
    Short name: rg_count_drop_bm_overflow
    Start address: 0x1435
    Statistics:
      block: pb_write
      name: bmOverflow
      type: error
    Type: rw
    Width: 0x18
  Check IPv4 Header Checksum:
    Address step: 1
    Attributes: []
    Default value: 0
    Description: This register provides an option to drop the IPv4 packet if its header checksum field has an incorrect value.\ifdef{\texRouting}{The option is only for not routed IPv4 packet. For a routed IPv4 packet, the checksum check is always performed.}{\ifdef{\texAclRouting}{The option is only for not routed IPv4 packet. For a routed IPv4 packet, the checksum check is always performed.}{}}
    End address: 0xb17
    Fields:
    - Default value: 0
      Description: If set, always calculate the checksum of the received IPv4 packet. If the calculated value does not match the IPv4 checksum field, the packet is dropped.
      End bit: 0
      Name: dropErrorChkSum
      Start bit: 0
      Width: 1
    Number of entries: 1
    Short name: rg_ipv4CheckSum
    Start address: 0xb17
    Type: rw
    Width: 1
  Color Remap From Egress Port:
    Address step: 2
    Attributes: []
    Default value: 1
    Description: Options for remapping internal packet color to outgoing packet headers. Each egress port has a separate color to field mapping.
    End address: 0x15c3
    Fields:
    - Default value: 1
      Description: \tabFour{Skip remap}{Remap to L3 only}{Remap to L2 only}{Remap to L2 and L3}
      End bit: 1
      Name: colorMode
      Start bit: 0
      Width: 2
    - Default value: 0
      Description: New TOS/TC value based on packet color. \newline \tabAddrThreeRows{bits [0:7]}{TOS/TC value for green} {bits [8:15]}{TOS/TC value for yellow} {bits [16:23]}{TOS/TC value for red}
      End bit: 0x19
      Name: color2Tos
      Start bit: 2
      Width: 0x18
    - Default value: 0
      Description: Mask for updating the TOS/TC field. For each bit in the mask, 0 means keep original value, 1 means update new value to that bit.
      End bit: 0x21
      Name: tosMask
      Start bit: 0x1a
      Width: 8
    - Default value: 0
      Description: New DEI value based on packet color. This is located in the outermost VLAN of the transmitted packet.\newline \tabAddrThreeRows{bit 0}{DEI value for green} {bit 1}{DEI value for yellow} {bit 2}{DEI value for red}
      End bit: 0x24
      Name: color2Dei
      Start bit: 0x22
      Width: 3
    Index: Egress Port
    Number of entries: 5
    Short name: r_portColorRemap_ss0
    Start address: 0x15ba
    Statistics: null
    Type: rw
    Width: 0x25
  Color Remap From Ingress Admission Control:
    Address step: 2
    Attributes: []
    Default value: 0
    Description: Options from ingress admission control to remap internal packet color to outgoing packet headers.
    End address: 0x15cb
    Fields:
    - Default value: 0
      Description: If set, the \field{Color Remap From Ingress Admission Control}{colorMode} field determines the remap process. Otherwise color remapping based on the ingress admission control is skipped.
      End bit: 0
      Name: enable
      Start bit: 0
      Width: 1
    - Default value: 0
      Description: \tabFour{Remap disabled}{Remap to L3 only}{Remap to L2 only}{Remap to L2 and L3}
      End bit: 2
      Name: colorMode
      Start bit: 1
      Width: 2
    - Default value: 0
      Description: New TOS/TC value based on packet color. \newline \tabAddrThreeRows{bits [0:7]}{TOS/TC value for green} {bits [8:15]}{TOS/TC value for yellow} {bits [16:23]}{TOS/TC value for red}
      End bit: 0x1a
      Name: color2Tos
      Start bit: 3
      Width: 0x18
    - Default value: 0
      Description: Mask for updating the TOS/TC field. For each bit in the mask, 0 means keep original value, 1 means update new value to that bit.
      End bit: 0x22
      Name: tosMask
      Start bit: 0x1b
      Width: 8
    - Default value: 0
      Description: New DEI value based on packet color. This is located in the outermost VLAN of the transmitted packet.\newline \tabAddrThreeRows{bit 0}{DEI value for green} {bit 1}{DEI value for yellow} {bit 2}{DEI value for red}
      End bit: 0x25
      Name: color2Dei
      Start bit: 0x23
      Width: 3
    Index: Meter Pointer
    Number of entries: 4
    Short name: r_mmpColorRemap_ss0
    Start address: 0x15c4
    Statistics: null
    Type: rw
    Width: 0x26
  Core Tick Configuration:
    Address step: 1
    Attributes: []
    Default value: 0x14007d00
    Description: Global register for setting the frequency of the core tick
    End address: 4
    Fields:
    - Default value: 0x7d00
      Description: The master Core Tick will be issued once every $rg_tick_div.clkDivider/256$ core clock cycles. If set to zero, there will be no tick.
      End bit: 0x18
      Name: clkDivider
      Start bit: 0
      Width: 0x19
    - Default value: 10
      Description: The four ticks derived from the master core tick are issued once every $rg_tick_div.stepDivider^{tick_number+1}$ master ticks. The master tick is tick number 0. If stepDivider is set to zero, there will be no ticks except possibly the master tick.
      End bit: 0x1c
      Name: stepDivider
      Start bit: 0x19
      Width: 4
    Number of entries: 1
    Short name: rg_core_tick_div
    Start address: 4
    Type: rw
    Width: 0x1d
  Core Tick Select:
    Address step: 1
    Attributes: []
    Default value: 1
    Description: Global register for setting clock input to the core tick divider
    End address: 5
    Fields:
    - Default value: 1
      Description: 'Select the source clock for the Core Tick divider. 0: disabled, 1: core clock, 2: debug_write_data[0], 3: reserved'
      End bit: 1
      Name: clkSelect
      Start bit: 0
      Width: 2
    Number of entries: 1
    Short name: rg_core_tick_sel
    Start address: 5
    Type: rw
    Width: 2
