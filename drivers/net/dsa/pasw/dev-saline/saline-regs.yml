      Description: Determine the absolute PTP start time of the updated gate cycle. Encode the value as \texttt{\{seconds[47:0], nanoseconds[31:0]\}}; the nanoseconds field must be less than 1,000,000,000. The value needs to be larger than Current Time when an update request is issued.
      End bit: 0x4f
      Name: adminBaseTime
      Start bit: 0
      Width: 0x50
    - Default value: 0
      Description: Time for one gate cycle. Encode the value as \texttt{\{seconds[47:0], nanoseconds[31:0]\}}; the nanoseconds field must be less than 1,000,000,000. Once a gate list starts executing, it will be restarted from the start address when the elapsed time equals this field.
      End bit: 0x9f
      Name: adminCycleTime
      Start bit: 0x50
      Width: 0x50
    - Default value: 0
      Description: Extra time for retaining the current gate status when the time until a pending update is less than this field. Encode the value as \texttt{\{seconds[47:0], nanoseconds[31:0]\}}; the nanoseconds field must be less than 1,000,000,000.
      End bit: 0xef
      Name: adminCycleTimeExtension
      Start bit: 0xa0
      Width: 0x50
    - Default value: 0
      Description: Number of execution entries in the \register{Ingress Transmission Gate List} for one gate cycle. If the gate cycle time is not enough to execute all the entries, the execution will abort the remaining entries.
      End bit: 0xf3
      Name: adminControlListLength
      Start bit: 0xf0
      Width: 4
    - Default value: 0
      Description: Point to the first entry to execute in one gate cycle.
      End bit: 0xf7
