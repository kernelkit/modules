    - Default value: 0
      Description: Packets
      End bit: 0x1f
      Name: count
      Start bit: 0
      Width: 0x20
    Index: Queue + Egress Port * 8
    Number of entries: 0x28
    Short name: r_dequeued_packets_ss0
