  Disable CPU tag on CPU Port:
    Address step: 1
    Attributes: []
    Default value: 0
    Description: When a packet is sent to the CPU port normally a To CPU Tag will be added to the packet. This register provides a option to disable the CPU tag
    End address: 0x163a
    Fields:
    - Default value: 0
      Description: When set, the CPU port will no longer add a CPU Tag to packets going to the CPU port. \tabTwo{To CPU Tag enabled}{To CPU Tag disabled}
      End bit: 0
      Name: disable
      Start bit: 0
      Width: 1
    - Default value: 0
      Description: When set, the CPU port will no longer add a CPU Tag to packets going to the CPU port with reason code 0(default reason). \tabTwo{To CPU Tag enabled}{To CPU Tag disabled}
      End bit: 1
      Name: disableReason0
      Start bit: 1
      Width: 1
    Number of entries: 1
    Short name: rg_disableCPUTag
    Start address: 0x163a
    Type: rw
    Width: 2
  Drain Port:
    Address step: 1
