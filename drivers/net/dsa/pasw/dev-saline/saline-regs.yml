    Description: Setup configurations for egress transmission gates. Hardware is not aware of the configuration updates unless an update request is triggered by writing 1 to \register{Egress Transmission Gate Update}. The transmission gate execution will start using the new configuration when the current time meets the \field{Egress Transmission Gate Configuration}{adminBaseTime}.
